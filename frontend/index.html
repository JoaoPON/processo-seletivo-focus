<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Perry Login</title>
</head>

<body>
    <main class="container">
        <form action="dashboard.html">
            <h1>Login Perry</h1>
            <div class="input-box">
                <input placeholder="Usuário" type="text" name="user" id="user">
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password" name="password" id="password">
                <button type="button" class="toggle-password" onclick="alternarSenha()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <div class="forgot">
                <a href="#">Esqueci senha</a>
            </div>

            <button type="submit" class="login">Login</button>
        </form>
    </main>
    <script>
        function alternarSenha() {
            const campo = document.getElementById("password");
            campo.type = campo.type === "password" ? "text" : "password";
        }
    </script>
</body>

</html>
