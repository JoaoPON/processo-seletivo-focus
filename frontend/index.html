<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Perry Login</title>
</head>

<body>
    <!--container do login-->
    <main class="container">
        <form id="form-login">
            <h1>Login Perry</h1>
            <div class="input-box">
                <input placeholder="Usuário" type="text" name="user" id="user" required>
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password" name="password" id="password" required>
                <button type="button" class="toggle-password" onclick="alternarSenha()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <p id="erro" style="color: red; min-height: 18px;"></p>
            <button type="submit" class="login" id="btn-entrar">Login</button>
        </form>
    </main>

    <!--js-->
    <script>
        function alternarSenha() {
            const campo = document.getElementById("password");
            campo.type = campo.type === "password" ? "text" : "password";
        }

        document.getElementById("form-login").addEventListener("submit", async (e) => {
            e.preventDefault();
            const erro = document.getElementById("erro");
            const btn = document.getElementById("btn-entrar");
            erro.textContent = "";
            btn.disabled = true;
            btn.textContent = "Entrando...";

            try {
                const resp = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user: document.getElementById("user").value.trim(),
                        password: document.getElementById("password").value,
                    }),
                });

                if (resp.ok) {
                    window.location.href = "/dashboard.html";
                } else {
                    const dados = await resp.json();
                    erro.textContent = dados.detail || "Usuário ou senha inválidos.";
                }
            } catch {
                erro.textContent = "Não foi possível conectar ao servidor.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Login";
            }
        });
    </script>
</body>

</html>
