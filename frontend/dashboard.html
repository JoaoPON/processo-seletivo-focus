<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard</title>
</head>

<body>
    <div class="side-tabs">
        <button class="side-tab active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Leads</span>
        </button>

        <button class="side-tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Calendário</span>
        </button>
    
        <button class="side-tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Gerência</span>
        </button>
    </div>


    <div class="main-layout" id="main-layout">
        <div class="dashboard"> <!--quadro de leads (full/esquerda)-->
            <div class="leads-header">
                <h1>Leads</h1>
                <div class="leads-buttons">
                    <button class="list">Importar Lista</button>
                    <button class="new">+ Novo</button>
                </div>
            </div>

            <div class="search">
                <input placeholder="Buscar por nome ou telefone..." type="text">
            </div>

            <div class="select">
                <select name="segments" id="segments">
                    <option value="0">Todos Segmentos</option>
                    <option value="1">Restaurante</option>
                    <option value="2">Clínica</option>
                    <option value="3">Criar novo segmento</option>
                </select>

                <select name="status" id="status">
                    <option value="0">Todos status</option>
                    <option value="1">Reunião marcada</option>
                    <option value="2">Descartado</option>
                    <option value="3">Criar um novo status</option>
                </select>
            </div>

            <div class="client-list" id="client-list">
                <button class="client-item">
                    <span class="client-avatar">C1</span>
                    <span class="client-info">
                        <span class="client-name">Cliente 1</span>
                        <span class="client-sub">
                            <span class="client-segment">Restaurante</span>
                            ·
                            <span class="client-number">1234-5678</span>
                        </span>
                    </span>
                    <span class="client-status">Reunião marcada</span>
                </button>

                <button class="client-item">
                    <span class="client-avatar">C2</span>
                    <span class="client-info">
                        <span class="client-name">Cliente 2</span>
                        <span class="client-sub">
                            <span class="client-segment">Clínica</span>
                            ·
                            <span class="client-number">8765-4321</span>
                        </span>
                    </span>
                    <span class="client-status">Reunião marcada</span>
                </button>

                <div class="leads-details" id="leads-details"> <!--quadro de detalhes (oculto/direita)-->
                    <h1>dados muitos dados</h1>
                    <!--dados de cada cliente-->
                </div>
            </div>

        </div>
    </div>
</body>

</html>
